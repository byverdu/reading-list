<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Reading List</title>
		<meta name="description" content="Articles worth reading.">
		<link rel="stylesheet" href="./lib/styles.css">
		<link rel="icon" href="assets/favicon.png" type="image/x-icon">
	</head>

	<body>
		<div class="shell">
			<header>
				<div class="header-eyebrow">Byverdu / reading-list</div>
				<h1>Reading List</h1>
				<p>Articles, essays, and references worth keeping.</p>
			</header>

			<div class="controls">
				<div class="search-wrap">
					<svg
						width="14"
						height="14"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						role="img"
						aria-labelledby="search"
					>
						<title>Search</title>
						<circle cx="11" cy="11" r="8" />
						<path d="m21 21-4.35-4.35" />
					</svg>
					<input
						id="search"
						type="search"
						placeholder="Search titles, notes, tags…"
						autocomplete="off"
					>
				</div>
				<div class="tag-bar">
					<span class="tag-bar-label">Tags</span>
					<div id="tag-list"></div>
				</div>
			</div>

			<p class="list-meta" id="list-meta"></p>
			<ul id="articles"></ul>

			<footer>
				<p>
					Add entries in
					<a
						href="https://github.com/byverdu/reading-list/blob/main/reading-list.json"
						target="_blank"
						rel="noopener"
						>reading-list.json</a
					>
					·
					<a
						href="https://github.com/byverdu/reading-list"
						target="_blank"
						rel="noopener"
						>GitHub</a
					>
				</p>
			</footer>
		</div>

		<script src="./lib/script.js"></script>
	</body>
</html>
