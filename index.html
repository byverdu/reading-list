<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Reading List</title>
		<meta name="description" content="Articles worth reading.">
		<link rel="stylesheet" href="./lib/styles.css">
		<link rel="icon" href="assets/favicon.png" type="image/x-icon">
		<link rel="preload" href="lib/reading-list.json" as="fetch" crossorigin>
		<script>
		window.articlesReady = fetch("lib/reading-list.json")
			.then((response) => {
				if (!response.ok) throw new Error(`HTTP ${response.status}`);
				return response.json();
			})
			.then((articles) => {
				const toSortable = (date) => date.split("-").reverse().join("-");
				articles.sort(
					(a, b) => new Date(toSortable(b.date)) - new Date(toSortable(a.date)),
				);
				window.allArticles = articles;
				return articles;
			});
		</script>
	</head>

	<body>
		<div class="shell">
			<header>
				<div class="header-eyebrow">Byverdu / reading-list</div>
				<h1>Reading List</h1>
				<p>Articles, essays, and references worth keeping.</p>
			</header>

			<div class="controls">
				<div class="search-wrap">
					<svg
						width="14"
						height="14"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						role="img"
						aria-labelledby="search"
					>
						<title>Search</title>
						<circle cx="11" cy="11" r="8" />
						<path d="m21 21-4.35-4.35" />
					</svg>
					<input
						id="search"
						type="search"
						placeholder="Search titles, notes, tags…"
						autocomplete="off"
					>
				</div>
				<tags-list></tags-list>
			</div>

			<p class="list-meta" id="list-meta"></p>
			<ul id="articles"></ul>

			<footer>
				<p>
					Made with <span class="love">&lt;3</span> by Byverdu ·
					<a
						href="https://github.com/byverdu/reading-list"
						target="_blank"
						rel="noopener"
						>GitHub</a
					>
				</p>
			</footer>
		</div>
		<template id="tag-list-template">
			<div class="tag-bar">
				<span class="tag-bar-label">Tags</span>
				<div id="tag-list"></div>
			</div>
		</template>
		<script>
		document.addEventListener("DOMContentLoaded", () => {
			customElements.define("tags-list", Tags);
			customElements.define("tag-item", Tag, { extends: "button" });
		});
		</script>
		<script src="./lib/script.js"></script>
	</body>
</html>
